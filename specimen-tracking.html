<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Specimen Tracking | LabCore</title>
  <link rel="stylesheet" href="shared/labcore-nav.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--lc-font); background:var(--lc-bg); color:var(--lc-text); }
    .main { margin-left:var(--lc-sidebar-w); padding:28px; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; gap:15px; margin-bottom:18px; }
    h1 { margin:0 0 5px; font-size:25px; } p { margin:0; color:var(--lc-muted); font-size:13px; }
    .btn { border:1px solid var(--lc-border); background:#fff; border-radius:5px; padding:7px 9px; font:inherit; font-size:12px; cursor:pointer; }
    .btn:hover { border-color:var(--lc-brand-primary); }
    .panel { background:#fff; border:1px solid var(--lc-border); border-radius:7px; padding:15px; margin-bottom:14px; }
    .filters { display:grid; grid-template-columns:minmax(180px,1fr) minmax(150px,220px) auto; gap:9px; align-items:end; margin-bottom:13px; }
    label { display:block; font-weight:600; font-size:12px; margin-bottom:5px; }
    input,select { width:100%; border:1px solid var(--lc-border); border-radius:5px; padding:9px 10px; background:#fff; color:var(--lc-text); font:inherit; font-size:13px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:850px; }
    th,td { text-align:left; vertical-align:top; padding:9px 8px; border-bottom:1px solid var(--lc-border); font-size:12px; }
    th { color:var(--lc-muted); text-transform:uppercase; font-size:10px; }
    .sub { display:block; color:var(--lc-muted); font-size:11px; margin-top:3px; }
    .badge { display:inline-block; padding:3px 8px; border-radius:12px; background:var(--lc-info-bg); color:var(--lc-info); font-size:11px; font-weight:700; white-space:nowrap; }
    .status-processing { background:var(--lc-warning-bg); color:var(--lc-warning); }
    .status-completed { background:var(--lc-success-bg); color:var(--lc-success); }
    .status-dispatched { background:#eceaf4; color:#3A3577; }
    .status-rejected { background:var(--lc-danger-bg); color:var(--lc-danger); }
    .actions { display:flex; flex-wrap:wrap; gap:5px; min-width:150px; }
    .notice { display:none; padding:10px 12px; margin-bottom:12px; border-radius:5px; background:var(--lc-info-bg); color:var(--lc-info); font-size:13px; }
    .notice.error { background:var(--lc-danger-bg); color:var(--lc-danger); }
    .history { display:none; }
    .history h2 { margin:0 0 10px; font-size:17px; }
    .event { border-left:3px solid var(--lc-brand-primary); padding:4px 0 11px 12px; margin-left:5px; }
    .event strong { font-size:13px; text-transform:capitalize; }
    .event p { margin-top:4px; }
    .empty { padding:18px; text-align:center; color:var(--lc-muted); }
    @media(max-width:900px) { .main { margin-left:0; padding:76px 16px 18px; } }
    @media(max-width:560px) { .head { flex-direction:column; } .filters { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside class="sidebar"></aside><div class="lc-sidebar-overlay"></div>
  <main class="main">
    <header class="head">
      <div><h1>Specimen Tracking</h1><p>Follow received specimens through processing, completion, dispatch or rejection. Status changes are recorded in an append-only history.</p></div>
      <button type="button" class="btn" id="refreshButton">Refresh</button>
    </header>
    <div class="notice" id="notice" role="status"></div>
    <section class="panel">
      <div class="filters">
        <div><label for="query">Search specimens</label><input id="query" type="search" placeholder="Patient, ID, visit or test"></div>
        <div><label for="statusFilter">Status</label><select id="statusFilter"><option value="">All statuses</option><option value="received">Received</option><option value="processing">Processing</option><option value="completed">Completed</option><option value="dispatched">Dispatched</option><option value="rejected">Rejected</option></select></div>
        <div id="shownCount" aria-live="polite"></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Specimen / patient</th><th>Tests</th><th>Type / container</th><th>Received</th><th>Current status</th><th>Update / history</th></tr></thead><tbody id="specimenRows"></tbody></table></div>
    </section>
    <section class="panel history" id="historyPanel" aria-live="polite">
      <h2 id="historyTitle">Specimen history</h2><div id="historyRows"></div>
    </section>
  </main>
  <script src="shared/labcore-api.js"></script><script src="shared/labcore-auth.js"></script><script src="shared/labcore-icons.js"></script><script src="shared/labcore-nav.js"></script>
  <script>
    (function () {
      'use strict';
      var specimens = [];
      var $ = function (id) { return document.getElementById(id); };
      var TIME_ZONE = 'Africa/Accra';
      function notice(message, error) {
        var el = $('notice'); el.textContent = message || ''; el.classList.toggle('error', !!error); el.style.display = message ? 'block' : 'none';
      }
      function addCell(row, value, subtext) {
        var td = document.createElement('td'); td.textContent = value || '—';
        if (subtext) { var sub = document.createElement('span'); sub.className = 'sub'; sub.textContent = subtext; td.appendChild(sub); }
        row.appendChild(td); return td;
      }
      function facilityTime(value) {
        if (!value) return '—';
        var date = new Date(value);
        return isNaN(date.getTime()) ? '—' : new Intl.DateTimeFormat(undefined, {
          timeZone: TIME_ZONE, dateStyle: 'medium', timeStyle: 'short'
        }).format(date) + ' (Accra)';
      }
      function button(label, action) {
        var el = document.createElement('button'); el.type = 'button'; el.className = 'btn'; el.textContent = label;
        el.addEventListener('click', action); return el;
      }
      function availableTransitions(status) {
        if (status === 'received') return [['processing', 'Start processing'], ['rejected', 'Reject']];
        if (status === 'processing') return [['completed', 'Mark completed'], ['rejected', 'Reject']];
        if (status === 'completed') return [['dispatched', 'Mark dispatched']];
        return [];
      }
      function render() {
        var q = $('query').value.trim().toLowerCase(), selectedStatus = $('statusFilter').value;
        var filtered = specimens.filter(function (s) {
          var searchText = [s.specimenId, s.patientName, s.patientId, s.visitId, (s.tests || []).join(' ')].join(' ').toLowerCase();
          return (!q || searchText.includes(q)) && (!selectedStatus || (s.status || 'received') === selectedStatus);
        });
        $('shownCount').textContent = filtered.length + ' specimen(s)';
        var body = $('specimenRows'); body.replaceChildren();
        filtered.forEach(function (s) {
          var row = document.createElement('tr'), status = s.status || 'received';
          addCell(row, s.specimenId, (s.patientName || '—') + ' · ' + (s.patientId || '—') + ' · ' + (s.visitId || '—'));
          addCell(row, (s.tests || []).join(', ') || '—');
          addCell(row, s.specimenType, s.container);
          addCell(row, facilityTime(s.receivedAt), 'Received by ' + (s.receivedBy || '—'));
          var stateCell = document.createElement('td'), badge = document.createElement('span');
          badge.className = 'badge status-' + status; badge.textContent = status; stateCell.appendChild(badge);
          if (s.statusAt) { var small = document.createElement('span'); small.className = 'sub'; small.textContent = facilityTime(s.statusAt) + ' · ' + (s.statusBy || '—'); stateCell.appendChild(small); }
          row.appendChild(stateCell);
          var actions = document.createElement('td'), wrap = document.createElement('div'); wrap.className = 'actions';
          availableTransitions(status).forEach(function (transition) {
            wrap.appendChild(button(transition[1], function () { changeStatus(s, transition[0]); }));
          });
          wrap.appendChild(button('History', function () { showHistory(s); }));
          actions.appendChild(wrap); row.appendChild(actions); body.appendChild(row);
        });
        if (!filtered.length) body.innerHTML = '<tr><td class="empty" colspan="6">No specimens match these filters.</td></tr>';
      }
      async function load() {
        try { specimens = await window.lcApiGetSpecimens(); render(); notice('', false); }
        catch (err) { notice('Could not load specimens: ' + err.message, true); }
      }
      async function changeStatus(specimen, status) {
        var note = '';
        if (status === 'rejected') {
          note = window.prompt('Enter the reason for rejecting this specimen:') || '';
          if (!note.trim()) { notice('A rejection reason is required; no status was changed.', true); return; }
        }
        try {
          await window.lcApiAddSpecimenEvent(specimen.specimenId, { status: status, note: note });
          notice('Specimen ' + specimen.specimenId + ' moved to ' + status + '.', false);
          await load();
          if ($('historyPanel').style.display === 'block') await showHistory(specimen);
        } catch (err) { notice('Status was not changed: ' + err.message, true); }
      }
      async function showHistory(specimen) {
        try {
          var events = await window.lcApiGetSpecimenEvents(specimen.specimenId);
          $('historyTitle').textContent = 'History · ' + specimen.specimenId;
          var target = $('historyRows'); target.replaceChildren();
          events.forEach(function (event) {
            var item = document.createElement('div'); item.className = 'event';
            var title = document.createElement('strong'); title.textContent = event.status; item.appendChild(title);
            var details = document.createElement('p'); details.textContent = facilityTime(event.at) + ' · ' + (event.by || '—') + (event.note ? ' · ' + event.note : '');
            item.appendChild(details); target.appendChild(item);
          });
          if (!events.length) { var empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = 'No status events recorded.'; target.appendChild(empty); }
          $('historyPanel').style.display = 'block';
          $('historyPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } catch (err) { notice('Could not load specimen history: ' + err.message, true); }
      }
      $('refreshButton').addEventListener('click', load);
      $('query').addEventListener('input', render);
      $('statusFilter').addEventListener('change', render);
      load();
    }());
  </script>
</body>
</html>
