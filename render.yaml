services:
  - type: web
    name: labcore-synthetic-test-frankfurt
    runtime: node
    plan: starter
    region: frankfurt
    numInstances: 1
    buildCommand: npm ci --prefix labcore-backend
    startCommand: npm start --prefix labcore-backend
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: labcore-postgres
          property: connectionString
      - key: PGSSL
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: labcore-production
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: labcore-postgres
    databaseName: labcore
    user: labcore
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
